<style>
:root{--ink:#101820;--muted:#5a6770;--paper:#eef3f0;--card:#fff;--line:rgba(16,24,32,.12);--sky:#0b6e8a;--deep:#074d3d;--max:920px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Sora,sans-serif;color:var(--ink);background:var(--paper);font-size:16px;line-height:1.65}
h1,h2,.brand{font-family:Fraunces,serif;letter-spacing:-.02em;line-height:1.12}
a{color:var(--deep)}
.wrap{width:min(var(--max),calc(100% - 2.2rem));margin:0 auto}
.nav{position:sticky;top:0;z-index:40;backdrop-filter:blur(12px);background:rgba(238,243,240,.95);border-bottom:1px solid var(--line)}
.nav-inner{display:flex;flex-wrap:wrap;gap:.5rem 1rem;justify-content:space-between;align-items:center;padding:.7rem 0;font-size:.82rem}
.nav-brand{font-family:Fraunces,serif;font-weight:750;color:var(--deep);text-decoration:none;font-size:1.05rem}
.nav-links{display:flex;flex-wrap:wrap;gap:.4rem .75rem}
.nav-links a{text-decoration:none;color:var(--muted);font-weight:600}
.nav-links a.on,.nav-links a:hover{color:var(--sky)}
.hero{padding:2.2rem 0 1rem}
.kicker{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--sky);margin-bottom:.35rem}
.brand{font-size:clamp(1.8rem,4vw,2.5rem);font-weight:750;color:var(--deep);margin-bottom:.4rem}
.lead{color:var(--muted);max-width:52ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.15rem;margin:1rem 0}
.card h2{font-size:1.1rem;margin-bottom:.45rem}
.card p,.card li{color:var(--muted);font-size:.9rem}
.card ul{padding-left:1.1rem;display:grid;gap:.28rem;margin-top:.35rem}
.tone{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:.7rem}
@media(max-width:720px){.tone{grid-template-columns:1fr}}
.tone div{border-radius:12px;padding:.85rem .95rem;font-size:.88rem}
.yes{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}
.no{background:#fff7ed;border:1px solid #fdba74;color:#7c2d12}
.btn{display:inline-flex;margin:.35rem .35rem 0 0;padding:.55rem .9rem;border-radius:999px;font-weight:700;font-size:.84rem;text-decoration:none;border:1px solid var(--line);background:#fff;color:var(--ink)}
.btn.primary{background:var(--sky);color:#fff;border-color:transparent}
.foot{padding:1.2rem 0 2rem;border-top:1px solid var(--line);color:var(--muted);font-size:.8rem;margin-top:1rem}
.todo{font-size:.84rem;color:var(--muted);margin-top:.5rem}
</style>
</head>
