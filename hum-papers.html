<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>文科成稿库 · 解知常</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,750&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--ink:#101820;--muted:#5a6770;--paper:#f0eee9;--card:#fff;--line:rgba(16,24,32,.12);--wine:#7a3e4a;--deep:#4a2430;--max:1000px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Sora,sans-serif;color:var(--ink);background:
  radial-gradient(800px 400px at 10% 0%, rgba(122,62,74,.08), transparent 55%),
  var(--paper);font-size:16px;line-height:1.6}
h1,h2,.brand{font-family:Fraunces,serif;letter-spacing:-.02em;line-height:1.12}
a{color:var(--deep)}
.wrap{width:min(var(--max),calc(100% - 2.2rem));margin:0 auto}
.nav{position:sticky;top:0;z-index:40;backdrop-filter:blur(12px);background:rgba(240,238,233,.95);border-bottom:1px solid var(--line)}
.nav-inner{display:flex;flex-wrap:wrap;gap:.5rem 1rem;justify-content:space-between;align-items:center;padding:.7rem 0;font-size:.82rem}
.nav-brand{font-family:Fraunces,serif;font-weight:750;color:var(--deep);text-decoration:none;font-size:1.05rem}
.nav-links{display:flex;flex-wrap:wrap;gap:.4rem .75rem}
.nav-links a{text-decoration:none;color:var(--muted);font-weight:600}
.nav-links a.on,.nav-links a:hover{color:var(--wine)}
.hero{padding:2rem 0 1rem}
.kicker{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--wine);margin-bottom:.3rem}
.brand{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:750;color:var(--deep);margin-bottom:.35rem}
.lead{color:var(--muted);max-width:52ch;font-size:.95rem}
.filters{display:flex;flex-wrap:wrap;gap:.4rem;margin:1rem 0}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:.35rem .75rem;font-weight:700;font-size:.78rem;cursor:pointer;color:var(--muted);font-family:inherit}
.filters button.on{background:var(--wine);color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.85rem;padding-bottom:2rem}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:16px;padding:1.1rem;box-shadow:0 10px 28px rgba(74,36,48,.04)}
.card .id{font-size:.72rem;font-weight:700;color:var(--wine);margin-bottom:.25rem}
.card h3{font-size:1.05rem;margin-bottom:.35rem;line-height:1.25}
.card .venue{font-size:.78rem;font-weight:700;color:var(--muted);margin-bottom:.45rem}
.card p{color:var(--muted);font-size:.88rem}
.meta{display:grid;gap:.2rem;margin-top:.7rem;font-size:.78rem;color:var(--muted)}
.meta b{color:var(--ink)}
.foot{padding:1rem 0 2rem;border-top:1px solid var(--line);color:var(--muted);font-size:.8rem}
#empty{display:none;color:var(--muted);padding:1rem 0 2rem}
</style>
</head>
<body>
<nav class="nav"><div class="wrap nav-inner">
  <a class="nav-brand" href="index.html">解知常</a>
  <div class="nav-links">
    <a href="track-humanities.html">文科交叉</a>
    <a href="hum-types.html">文科写法</a>
    <a href="hum-datasets.html">文科数据</a>
    <a class="on" href="hum-papers.html">文科成稿</a>
  </div>
</div></nav>

<header class="hero wrap">
  <div class="kicker">工具 · 文科成稿</div>
  <div class="brand">分支成稿卡</div>
  <p class="lead">展示题名、写法、数据与工程来源。本站不托管客户 PDF；细节在本地工程包。</p>
  <div class="filters" id="filters"></div>
</header>

<main class="wrap">
  <div class="grid" id="grid"></div>
  <p id="empty">该分支暂无成稿卡。</p>
</main>
<footer class="foot"><div class="wrap">文科成稿 · #branch=finance 可分享</div></footer>
<script src="data/hum-datasets.js"></script>
<script src="data/hum-papers.js"></script>
<script>
(function(){
  const branches = Object.assign({all:{label:"全部"}}, window.HUM_BRANCHES||{});
  const papers = window.HUM_PAPERS||[];
  const filters = document.getElementById("filters");
  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");

  function currentBranch(){
    const m = (location.hash||"").match(/branch=([a-z]+)/);
    return (m && branches[m[1]]) ? m[1] : "all";
  }
  function renderFilters(){
    filters.innerHTML = "";
    Object.keys(branches).forEach(k=>{
      const b = document.createElement("button");
      b.textContent = branches[k].label;
      b.className = currentBranch()===k ? "on" : "";
      b.onclick = ()=>{ location.hash = k==="all" ? "" : "branch="+k; render(); };
      filters.appendChild(b);
    });
  }
  function render(){
    const br = currentBranch();
    renderFilters();
    const rows = papers.filter(p => br==="all" || p.branch===br);
    grid.innerHTML = "";
    empty.style.display = rows.length ? "none" : "block";
    rows.forEach(p=>{
      const bl = (window.HUM_BRANCHES[p.branch]||{}).label || p.branch;
      const el = document.createElement("article");
      el.className = "card";
      el.innerHTML = `
        <div class="id">${p.id} · ${bl}</div>
        <h3>${p.title}</h3>
        <div class="venue">${p.venue}</div>
        <p>${p.blurb}</p>
        <div class="meta">
          <div><b>写法</b> ${p.writing}</div>
          <div><b>数据</b> ${p.data}</div>
          <div><b>源</b> ${p.source}</div>
        </div>`;
      grid.appendChild(el);
    });
  }
  window.addEventListener("hashchange", render);
  render();
})();
</script>
</body>
</html>
