<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>医学影像数据集目录 · 解知常</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,750&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --ink:#101820;--muted:#5a6770;--paper:#e8f0ec;--card:#fff;--line:rgba(16,24,32,.1);
  --teal:#0c7a5f;--deep:#074d3d;--max:1040px;
  --glow:radial-gradient(ellipse 80% 50% at 10% -10%,rgba(12,122,95,.14),transparent 55%),
         radial-gradient(ellipse 60% 40% at 90% 0%,rgba(7,77,61,.08),transparent 50%);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Sora,sans-serif;color:var(--ink);background:var(--paper);background-image:var(--glow);background-attachment:fixed;font-size:15px;line-height:1.55}
h1,h2,.brand{font-family:Fraunces,serif;letter-spacing:-.02em}
a{color:var(--deep);text-underline-offset:3px}
.wrap{width:min(var(--max),calc(100% - 2rem));margin:0 auto}
.nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);background:rgba(232,240,236,.92);border-bottom:1px solid var(--line)}
.nav-inner{display:flex;flex-wrap:wrap;gap:.5rem 1rem;justify-content:space-between;align-items:center;padding:.7rem 0;font-size:.84rem}
.nav-brand{font-family:Fraunces,serif;font-weight:750;color:var(--deep);text-decoration:none;font-size:1.05rem}
.nav-links{display:flex;flex-wrap:wrap;gap:.45rem .75rem}
.nav-links a{text-decoration:none;color:var(--muted);font-weight:600}
.nav-links a.on,.nav-links a:hover{color:var(--teal)}
.hero{padding:1.85rem 0 1.1rem}
.kicker{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--teal);margin-bottom:.4rem}
.brand{font-size:clamp(1.65rem,3.8vw,2.35rem);font-weight:750;color:var(--deep);margin-bottom:.4rem}
.lead{color:var(--muted);max-width:52ch;font-size:.92rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:1rem 0 .85rem}
.chip{font-size:.78rem;font-weight:700;padding:.28rem .7rem;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.85);color:var(--muted);backdrop-filter:blur(6px)}
.chip b{color:var(--deep);font-family:Fraunces,serif;font-size:1.05em}
.jump{display:flex;flex-wrap:wrap;gap:.35rem;margin:0 0 1rem}
.jump a{font-size:.74rem;font-weight:700;text-decoration:none;padding:.3rem .6rem;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);transition:color .15s,border-color .15s}
.jump a:hover{color:var(--teal);border-color:#a7f3d0}
.tools{display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:1.1rem;align-items:center}
.tools input{flex:1;min-width:200px;border:1px solid var(--line);border-radius:12px;padding:.58rem .85rem;font:inherit;background:#fff;box-shadow:0 1px 0 rgba(255,255,255,.8)}
.btn{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:.42rem .78rem;font:inherit;font-size:.78rem;font-weight:700;cursor:pointer}
.btn:hover{color:var(--teal);border-color:#a7f3d0}
.dept{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:.85rem;overflow:hidden;box-shadow:0 8px 28px rgba(7,77,61,.04)}
.dept>summary{cursor:pointer;list-style:none;padding:1.05rem 1.15rem;display:flex;flex-wrap:wrap;gap:.55rem;justify-content:space-between;align-items:flex-start;background:linear-gradient(165deg,#f4faf7 0%,#fff 55%)}
.dept>summary::-webkit-details-marker{display:none}
.dept>summary::before{content:"科室";font-size:.62rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin-right:.4rem;padding-top:.25rem}
.dept-title{font-family:Fraunces,serif;font-size:1.18rem;font-weight:750;color:var(--deep)}
.dept-blurb{color:var(--muted);font-size:.84rem;margin-top:.25rem;max-width:58ch}
.dept-body{padding:.15rem 1rem 1.05rem;border-top:1px solid var(--line)}
.sub{border:1px solid var(--line);border-radius:14px;margin:.65rem 0;background:#fbfcfc;overflow:hidden}
.sub>summary{cursor:pointer;list-style:none;padding:.75rem .95rem;display:flex;flex-wrap:wrap;gap:.4rem .65rem;justify-content:space-between;align-items:center}
.sub>summary::-webkit-details-marker{display:none}
.sub>summary::before{content:"+";color:var(--teal);font-weight:700;margin-right:.3rem;font-size:1.05rem}
.sub[open]>summary::before{content:"–"}
.sub-title{font-family:Fraunces,serif;font-weight:750;font-size:1.02rem;color:var(--deep)}
.sub-eyebrow{font-size:.62rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);display:block;margin-bottom:.12rem}
.meta{display:flex;flex-wrap:wrap;gap:.28rem}
.tag{font-size:.65rem;font-weight:700;padding:.12rem .45rem;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted)}
.tag.empty{background:#fff7ed;color:#c2410c;border-color:#fdba74}
.tag.partial{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
.tag.ready{background:#ecfdf5;color:#065f46;border-color:#a7f3d0}
.sub-body{padding:.2rem .95rem .95rem;border-top:1px dashed var(--line)}
.local{font-size:.78rem;color:var(--muted);margin:.15rem 0 .45rem}
.local code{font-size:.76rem;background:#eef6f3;padding:.05rem .3rem;border-radius:4px}
.ds-list{display:grid;gap:.45rem;margin-top:.35rem}
.ds{display:grid;grid-template-columns:minmax(0,1.15fr) auto minmax(0,1.35fr);gap:.35rem .75rem;align-items:start;padding:.55rem .65rem;border-radius:12px;background:#fff;border:1px solid var(--line)}
.ds:hover{border-color:#a7f3d0;box-shadow:0 4px 14px rgba(12,122,95,.06)}
.ds-name{font-weight:700;font-size:.88rem;color:var(--ink);line-height:1.35}
.ds-name a{text-decoration:none;color:inherit}
.ds-name a:hover{color:var(--teal);text-decoration:underline}
.ds-kind{font-size:.64rem;font-weight:700;padding:.12rem .4rem;border-radius:6px;background:#eef6f3;color:#065f46;white-space:nowrap;align-self:center}
.ds-note{font-size:.78rem;color:var(--muted);grid-column:1/-1;line-height:1.45}
.ds-link{font-size:.76rem;font-weight:600;word-break:break-all;align-self:center}
.ds-link a{text-decoration:none}
.ds-link a:hover{text-decoration:underline}
.empty{color:var(--muted);font-style:italic;font-size:.85rem;padding:.4rem 0}
.foot{padding:1.4rem 0 2.2rem;color:var(--muted);font-size:.78rem;border-top:1px solid var(--line);margin-top:1.2rem}
.hidden{display:none!important}
@media(max-width:720px){
  .ds{grid-template-columns:1fr auto;gap:.3rem .5rem}
  .ds-link{grid-column:1/-1}
}
</style>
</head>
<body>
<nav class="nav"><div class="wrap nav-inner">
  <a class="nav-brand" href="index.html">解知常</a>
  <div class="nav-links">
    <a href="index.html">首页</a>
    <a href="journals.html">期刊调研</a>
    <a href="imaging-papers.html">医工成稿</a>
    <a class="on" href="imaging-datasets.html">影像数据集</a>
    <a href="https://paper-doctor.onrender.com/" target="_blank" rel="noopener">组学成稿库</a>
  </div>
</div></nav>

<header class="hero wrap">
  <div class="kicker">Public medical imaging datasets</div>
  <div class="brand">医学影像数据集库</div>
  <p class="lead">按医院科室浏览公开数据集：二级为病症 / 模态，条目含名称、类型与下载链接。</p>
  <div class="chips" id="stats"></div>
  <div class="jump" id="jump"></div>
  <div class="tools">
    <input id="q" type="search" placeholder="搜索科室、二级目录或数据集…" autocomplete="off" />
    <button class="btn" type="button" id="btnExpand">全部展开</button>
    <button class="btn" type="button" id="btnCollapse">全部收起</button>
  </div>
</header>

<main class="wrap" id="list"></main>
<footer class="foot"><div class="wrap">科室 → 二级目录 → 数据集 · 数据源 <code>data/imaging-datasets.js</code></div></footer>

<script src="data/imaging-datasets.js"></script>
<script>
(function(){
  const stLabel={empty:'待补充',partial:'部分',ready:'较全'};
  const state=window.IMAGING_DATASETS||{meta:{},departments:[]};
  const deps=Array.isArray(state.departments)?state.departments:[];
  const list=document.getElementById('list');

  function esc(t){return String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  function escA(t){return esc(t).replace(/"/g,'&quot;')}

  const subs=deps.reduce((n,d)=>n+(d.children||[]).length,0);
  const dss=deps.reduce((n,d)=>n+(d.children||[]).reduce((m,c)=>m+(c.datasets||[]).length,0),0);
  document.getElementById('stats').innerHTML=`
    <span class="chip">科室 <b>${deps.length}</b></span>
    <span class="chip">二级目录 <b>${subs}</b></span>
    <span class="chip">数据集 <b>${dss}</b></span>
    ${state.meta&&state.meta.updated?`<span class="chip">更新 <b>${esc(state.meta.updated)}</b></span>`:''}`;
  document.getElementById('jump').innerHTML=deps.map(d=>`<a href="#dept-${escA(d.id)}">${esc(d.name_zh)}</a>`).join('');

  list.innerHTML=deps.map(d=>{
    const kids=d.children||[];
    const nDs=kids.reduce((n,c)=>n+(c.datasets||[]).length,0);
    return `
    <details class="dept" id="dept-${escA(d.id)}" open
      data-blob="${escA([d.name_zh,d.blurb,kids.map(c=>[c.name_zh,c.modality,c.task,(c.datasets||[]).map(x=>[x.name,x.note,x.kind].join(' ')].join(' ')].join(' ')].join(' '))].join(' '))}">
      <summary>
        <div>
          <div class="dept-title">${esc(d.name_zh)}</div>
          ${d.blurb?`<div class="dept-blurb">${esc(d.blurb)}</div>`:''}
        </div>
        <span class="meta">
          <span class="tag">${kids.length} 个二级</span>
          <span class="tag">${nDs} 数据集</span>
        </span>
      </summary>
      <div class="dept-body">
        ${kids.map(c=>{
          const ds=c.datasets||[];
          return `
          <details class="sub" open
            data-blob="${escA([c.name_zh,c.modality,c.task,ds.map(x=>[x.name,x.url,x.note,x.kind].join(' ')].join(' ')].join(' '))}">
            <summary>
              <div>
                <span class="sub-eyebrow">二级目录</span>
                <span class="sub-title">${esc((c.name_zh||'').replace(/^二级[：:]\s*/,''))}</span>
              </div>
              <span class="meta">
                <span class="tag ${c.status||'empty'}">${stLabel[c.status]||'待补充'}</span>
                ${c.modality?`<span class="tag">${esc(c.modality)}</span>`:''}
                ${c.task?`<span class="tag">${esc(c.task)}</span>`:''}
                <span class="tag">${ds.length} 条</span>
              </span>
            </summary>
            <div class="sub-body">
              ${c.local?`<p class="local">本地：<code>${esc(c.local)}</code></p>`:''}
              <div class="ds-list">
                ${ds.length?ds.map(x=>{
                  const url=(x.url||'').trim();
                  const name=esc(x.name||'未命名');
                  return `
                  <article class="ds">
                    <div class="ds-name">${url?`<a href="${escA(url)}" target="_blank" rel="noopener">${name}</a>`:name}</div>
                    <span class="ds-kind">${esc(x.kind||'dataset')}</span>
                    <div class="ds-link">${url?`<a href="${escA(url)}" target="_blank" rel="noopener">${esc(url.length>64?url.slice(0,62)+'…':url)}</a>`:'—'}</div>
                    ${x.note||x.license?`<div class="ds-note">${esc([x.note,x.license].filter(Boolean).join(' · '))}</div>`:''}
                  </article>`;
                }).join(''):'<p class="empty">暂无数据集</p>'}
              </div>
            </div>
          </details>`;
        }).join('')||'<p class="empty">暂无二级目录</p>'}
      </div>
    </details>`;
  }).join('')||'<p class="empty">暂无数据</p>';

  function applyQ(){
    const s=document.getElementById('q').value.trim().toLowerCase();
    list.querySelectorAll('.dept').forEach(dep=>{
      let any=false;
      dep.querySelectorAll('.sub').forEach(sub=>{
        const blob=((sub.dataset.blob||'')+' '+(dep.dataset.blob||'')).toLowerCase();
        const ok=!s||blob.includes(s);
        sub.classList.toggle('hidden',!ok);
        if(ok) any=true;
      });
      const deptHit=!s||(dep.dataset.blob||'').toLowerCase().includes(s);
      dep.classList.toggle('hidden',s?!any&&!deptHit:false);
      if(s&&any) dep.open=true;
    });
  }

  document.getElementById('q').addEventListener('input',applyQ);
  document.getElementById('btnExpand').onclick=()=>list.querySelectorAll('details').forEach(d=>d.open=true);
  document.getElementById('btnCollapse').onclick=()=>list.querySelectorAll('details.dept').forEach(d=>d.open=false);
})();
</script>
</body>
</html>
