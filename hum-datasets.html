<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>文科公开数据集 · 解知常</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,750&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--ink:#101820;--muted:#5a6770;--paper:#f0eee9;--card:#fff;--line:rgba(16,24,32,.12);--wine:#7a3e4a;--deep:#4a2430;--max:1000px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Sora,sans-serif;color:var(--ink);background:var(--paper);font-size:16px;line-height:1.6}
h1,h2,.brand{font-family:Fraunces,serif;letter-spacing:-.02em;line-height:1.12}
a{color:var(--deep)}
.wrap{width:min(var(--max),calc(100% - 2.2rem));margin:0 auto}
.nav{position:sticky;top:0;z-index:40;backdrop-filter:blur(12px);background:rgba(240,238,233,.95);border-bottom:1px solid var(--line)}
.nav-inner{display:flex;flex-wrap:wrap;gap:.5rem 1rem;justify-content:space-between;align-items:center;padding:.7rem 0;font-size:.82rem}
.nav-brand{font-family:Fraunces,serif;font-weight:750;color:var(--deep);text-decoration:none;font-size:1.05rem}
.nav-links{display:flex;flex-wrap:wrap;gap:.4rem .75rem}
.nav-links a{text-decoration:none;color:var(--muted);font-weight:600}
.nav-links a.on,.nav-links a:hover{color:var(--wine)}
.hero{padding:2rem 0 1rem}
.kicker{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--wine);margin-bottom:.3rem}
.brand{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:750;color:var(--deep);margin-bottom:.35rem}
.lead{color:var(--muted);max-width:50ch;font-size:.95rem}
.filters{display:flex;flex-wrap:wrap;gap:.4rem;margin:1rem 0}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:.35rem .75rem;font-weight:700;font-size:.78rem;cursor:pointer;color:var(--muted);font-family:inherit}
.filters button.on{background:var(--wine);color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;padding-bottom:2rem}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem}
.card .meta{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.45rem}
.badge{font-size:.68rem;font-weight:700;padding:.14rem .45rem;border-radius:999px;background:rgba(122,62,74,.1);color:var(--wine)}
.badge.open{background:#ecfdf5;color:#065f46}
.badge.apply{background:#fff7ed;color:#9a3412}
.card h3{font-size:1.02rem;margin-bottom:.3rem}
.card p{color:var(--muted);font-size:.86rem}
.card .notes{margin-top:.45rem;font-size:.78rem;color:var(--muted)}
.card a.go{display:inline-block;margin-top:.55rem;font-weight:700;font-size:.86rem;text-decoration:none;color:var(--wine)}
.foot{padding:1rem 0 2rem;border-top:1px solid var(--line);color:var(--muted);font-size:.8rem}
#empty{display:none;color:var(--muted);padding:1rem 0 2rem}
</style>
</head>
<body>
<nav class="nav"><div class="wrap nav-inner">
  <a class="nav-brand" href="index.html">解知常</a>
  <div class="nav-links">
    <a href="track-humanities.html">文科交叉</a>
    <a href="hum-types.html">文科写法</a>
    <a class="on" href="hum-datasets.html">文科数据</a>
    <a href="hum-papers.html">文科成稿</a>
  </div>
</div></nav>

<header class="hero wrap">
  <div class="kicker">工具 · 文科数据</div>
  <div class="brand">按分支浏览公开入口</div>
  <p class="lead">成稿推荐优先；需审核申请的库会标 apply。不挂本地路径。</p>
  <div class="filters" id="filters"></div>
</header>

<main class="wrap">
  <div class="grid" id="grid"></div>
  <p id="empty">该分支暂无条目。</p>
</main>
<footer class="foot"><div class="wrap">文科数据集 · hash 可分享 #branch=mgmt</div></footer>
<script src="data/hum-datasets.js"></script>
<script>
(function(){
  const branches = Object.assign({all:{label:"全部"}}, window.HUM_BRANCHES||{});
  const data = window.HUM_DATASETS||[];
  const filters = document.getElementById("filters");
  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");

  function currentBranch(){
    const m = (location.hash||"").match(/branch=([a-z]+)/);
    return (m && branches[m[1]]) ? m[1] : "all";
  }

  function renderFilters(){
    filters.innerHTML = "";
    Object.keys(branches).forEach(k=>{
      const b = document.createElement("button");
      b.textContent = branches[k].label;
      b.className = currentBranch()===k ? "on" : "";
      b.onclick = ()=>{ location.hash = k==="all" ? "" : "branch="+k; render(); };
      filters.appendChild(b);
    });
  }

  function render(){
    const br = currentBranch();
    renderFilters();
    const rows = data.filter(d => br==="all" || d.branch===br)
      .sort((a,b)=> (a.tier==="featured"?0:1)-(b.tier==="featured"?0:1) || a.name.localeCompare(b.name,"zh"));
    grid.innerHTML = "";
    empty.style.display = rows.length ? "none" : "block";
    rows.forEach(d=>{
      const el = document.createElement("article");
      el.className = "card";
      const bl = (window.HUM_BRANCHES[d.branch]||{}).label || d.branch;
      el.innerHTML = `
        <div class="meta">
          <span class="badge">${bl}</span>
          <span class="badge ${d.access}">${d.access==="open"?"公开":"需申请"}</span>
          ${d.tier==="featured"?'<span class="badge">成稿推荐</span>':""}
        </div>
        <h3>${d.name}</h3>
        <p>${d.why}</p>
        <div class="notes">${d.notes||""}</div>
        <a class="go" href="${d.url}" target="_blank" rel="noopener">打开入口 →</a>`;
      grid.appendChild(el);
    });
  }

  window.addEventListener("hashchange", render);
  render();
})();
</script>
</body>
</html>
