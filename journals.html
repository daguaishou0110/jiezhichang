<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>期刊调研 · 公开医学影像 × 计算机方法</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,750&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{--ink:#101820;--muted:#5a6770;--paper:#eef3f0;--card:#fff;--line:rgba(16,24,32,.12);--teal:#0c7a5f;--deep:#074d3d;--max:960px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Sora,sans-serif;color:var(--ink);background:var(--paper);font-size:15.5px;line-height:1.6}
h1,h2,h3,.brand{font-family:Fraunces,serif;letter-spacing:-.02em;line-height:1.15}
a{color:var(--deep);text-underline-offset:3px}
.wrap{width:min(var(--max),calc(100% - 2rem));margin:0 auto}
.nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);background:rgba(238,243,240,.95);border-bottom:1px solid var(--line)}
.nav-inner{display:flex;flex-wrap:wrap;gap:.5rem 1rem;justify-content:space-between;align-items:center;padding:.7rem 0;font-size:.84rem}
.nav-brand{font-family:Fraunces,serif;font-weight:750;color:var(--deep);text-decoration:none;font-size:1.05rem}
.nav-links{display:flex;flex-wrap:wrap;gap:.45rem .75rem}
.nav-links a{text-decoration:none;color:var(--muted);font-weight:600}
.nav-links a.on,.nav-links a:hover{color:var(--teal)}
.hero{padding:2rem 0 1rem}
.kicker{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--teal);margin-bottom:.35rem}
.brand{font-size:clamp(1.8rem,4vw,2.5rem);font-weight:750;color:var(--deep);margin-bottom:.4rem}
.lead{color:var(--muted);max-width:48ch}
.hard{margin-top:.85rem;padding:.8rem .95rem;border-radius:12px;background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;font-size:.88rem;font-weight:600}
.warn{margin-top:.55rem;padding:.75rem .9rem;border-radius:12px;background:#fff7ed;border:1px solid #fdba74;color:#7c2d12;font-size:.84rem}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin:1rem 0}
.box h2{font-size:1.05rem;margin-bottom:.45rem}
.box ul{padding-left:1.1rem;color:var(--muted);font-size:.88rem}
.box li{margin:.25rem 0}
.ds{display:flex;flex-wrap:wrap;gap:.35rem;margin:.35rem 0 1rem}
.ds span{font-size:.72rem;font-weight:700;padding:.2rem .55rem;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:.86rem;margin-top:.4rem}
th,td{text-align:left;padding:.45rem .4rem;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}
td.num{font-family:Fraunces,serif;font-weight:750;font-size:1.15rem;color:var(--deep);white-space:nowrap}
.note{font-size:.75rem;color:var(--muted)}
.zone{margin:1.35rem 0}
.zone h2{font-size:1.15rem;color:var(--deep);margin-bottom:.25rem}
.blurb{color:var(--muted);font-size:.88rem;margin-bottom:.7rem}
.j{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem;margin-bottom:.6rem}
.j-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.6rem;align-items:flex-start}
.j h3{font-size:1.02rem}
.zh{font-size:.86rem;font-weight:600;color:var(--deep);margin:.15rem 0 .4rem}
.count{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:12px;padding:.45rem .7rem;text-align:right;min-width:7.5rem}
.count b{display:block;font-family:Fraunces,serif;font-size:1.5rem;color:var(--deep);line-height:1.1}
.count span{font-size:.68rem;font-weight:700;color:#065f46}
.meta{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.45rem}
.tag{font-size:.68rem;font-weight:700;padding:.12rem .45rem;border-radius:999px;border:1px solid var(--line);background:#f8faf9;color:var(--muted)}
.tag.ok{background:#ecfdf5;color:#065f46;border-color:#a7f3d0}
.tag.z1{background:#fef2f2;color:#991b1b;border-color:#fecaca}
.tag.z2{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe}
.tag.z3{background:#f5f3ff;color:#5b21b6;border-color:#ddd6fe}
.tag.z4{background:#fff7ed;color:#c2410c;border-color:#fdba74}
.fit{font-size:.88rem;margin-bottom:.35rem}
.ex{margin-top:.5rem;border-top:1px dashed var(--line);padding-top:.5rem}
.ex h4{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:.3rem}
.ex a{display:block;font-size:.84rem;font-weight:600;margin:.35rem 0 .1rem;text-decoration:none}
.ex a:hover{text-decoration:underline}
.ex .dn{font-size:.78rem;color:var(--muted)}
.foot{padding:1.4rem 0 2rem;color:var(--muted);font-size:.8rem;border-top:1px solid var(--line);margin-top:1rem}
</style>
</head>
<body>
<nav class="nav"><div class="wrap nav-inner">
  <a class="nav-brand" href="index.html">解知常</a>
  <div class="nav-links">
    <a href="index.html">首页</a>
    <a href="types.html">写作类型</a>
    <a class="on" href="journals.html">期刊调研</a>
    <a href="portal.html">Portal</a>
  </div>
</div></nav>

<header class="hero wrap">
  <div class="kicker">Journal survey · public medical imaging × CS</div>
  <div class="brand">解知常</div>
  <p class="lead">期刊调研：哪些刊收「医工交叉 · 医学影像 · 仅公开数据 · 计算方法方法」；每刊附 2025–2026 范文，并标出 <b>2026 年此类发文量（估算）</b>。</p>
  <div class="hard" id="hard"></div>
  <div class="warn" id="part"></div>
</header>

<main class="wrap">
  <section class="box">
    <h2>2026 年「医学影像 + 计算方法」发文量总表</h2>
    <p class="note" id="countDef"></p>
    <table>
      <thead><tr><th>分区</th><th>期刊</th><th>2026 此类≈</th><th>备注</th></tr></thead>
      <tbody id="countTable"></tbody>
    </table>
  </section>

  <section class="box" id="exclude"></section>
  <h2 style="font-size:1.05rem">可用公开集</h2>
  <div class="ds" id="ds"></div>
  <section class="box" id="route"></section>
  <div id="zones"></div>
</main>

<footer class="foot"><div class="wrap">数据：<code>data/journals-imaging-public.json</code> · 计数：<code>data/journals-imaging-counts-2026.json</code></div></footer>

<script src="data/journals-imaging-public.js"></script>
<script>
(function(){
  const D=window.JOURNAL_IMAGING_PUBLIC; if(!D) return;
  document.getElementById('hard').textContent='硬约束：'+D.meta.hard_constraint;
  document.getElementById('part').textContent=D.meta.partition_standard+'。范文给 DOI 即可。';
  const C=D.counts_2026||{};
  document.getElementById('countDef').textContent=(C.definition||'')+' 来源：'+(C.source||'')+' · 检索日 '+(C.retrieved||'')+'。';

  document.getElementById('exclude').innerHTML='<h2>明确排除</h2><ul>'+(D.exclude||[]).map(x=>'<li><b>'+x.name+'</b> — '+x.why+'</li>').join('')+'</ul>';
  document.getElementById('ds').innerHTML=(D.public_datasets||[]).map(d=>'<span>'+d.name+' · '+d.task+'</span>').join('');
  document.getElementById('route').innerHTML='<h2>怎么选</h2><ul>'+(D.route||[]).map(r=>'<li>若 <b>'+r.if+'</b> → '+r.then+'</li>').join('')+'</ul>';

  const zc={1:'z1',2:'z2',3:'z3',4:'z4'};
  const rows=[];
  (D.zones||[]).forEach(z=>{
    (z.journals||[]).forEach(j=>{
      rows.push({zone:z.zone, name:j.name, n:j.n_2026, note:j.n_2026_note||''});
    });
  });
  rows.sort((a,b)=>(b.n||0)-(a.n||0));
  document.getElementById('countTable').innerHTML=rows.map(r=>`
    <tr>
      <td>${r.zone}区</td>
      <td>${r.name}</td>
      <td class="num">${r.n==null?'—':r.n}</td>
      <td class="note">${r.note||''}</td>
    </tr>`).join('');

  document.getElementById('zones').innerHTML=(D.zones||[]).map(z=>`
    <section class="zone">
      <h2>${z.label}</h2>
      <p class="blurb">${z.blurb||''}</p>
      ${(z.journals||[]).map(j=>`
        <article class="j">
          <div class="j-top">
            <div>
              <h3>${j.name}</h3>
              <div class="zh">${j.name_zh||''} · ${j.publisher||''}</div>
              <div class="meta">
                <span class="tag ${zc[z.zone]}">${z.zone}区</span>
                <span class="tag ok">公开数据可投</span>
                <span class="tag">难度 ${j.ease||''}</span>
              </div>
            </div>
            <div class="count">
              <b>${j.n_2026==null?'—':j.n_2026}</b>
              <span>2026 此类≈</span>
            </div>
          </div>
          <p class="fit">${j.fit||''}</p>
          ${j.n_2026_note?`<p class="note">${j.n_2026_note}</p>`:''}
          <div class="meta">${(j.datasets||[]).map(id=>{const d=(D.public_datasets||[]).find(x=>x.id===id);return d?'<span class="tag">'+d.name+'</span>':'';}).join('')}</div>
          <div class="ex"><h4>范文（2025–2026 · DOI）</h4>
            ${(j.exemplars||[]).map(e=>`
              <a href="https://doi.org/${e.doi}" target="_blank" rel="noopener">${e.year} · ${e.title}</a>
              <div class="dn">${e.data_note||''} · ${e.doi}</div>
            `).join('')}
          </div>
        </article>`).join('')}
    </section>`).join('');
})();
</script>
</body>
</html>
