<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>期刊调研 · 一至四区写法分布与收文方向</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,750&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --ink:#101820;--muted:#5a6770;--paper:#eef3f0;--card:#fff;
  --line:rgba(16,24,32,.12);--teal:#0c7a5f;--deep:#074d3d;
  --warm:#c45c16;--sky:#0b6e8a;--max:920px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Sora,sans-serif;color:var(--ink);background:var(--paper);font-size:16px;line-height:1.65}
h1,h2,h3,.brand{font-family:Fraunces,serif;letter-spacing:-.02em;line-height:1.12}
a{color:var(--deep);text-underline-offset:3px}
.wrap{width:min(var(--max),calc(100% - 2.2rem));margin:0 auto}

.nav{position:sticky;top:0;z-index:40;backdrop-filter:blur(12px);background:rgba(238,243,240,.94);border-bottom:1px solid var(--line)}
.nav-inner{display:flex;flex-wrap:wrap;gap:.55rem 1rem;justify-content:space-between;align-items:center;padding:.75rem 0;font-size:.84rem}
.nav-brand{font-family:Fraunces,serif;font-weight:750;color:var(--deep);text-decoration:none;font-size:1.05rem}
.nav-links{display:flex;flex-wrap:wrap;gap:.45rem .85rem}
.nav-links a{text-decoration:none;color:var(--muted);font-weight:600}
.nav-links a:hover{color:var(--teal)}

.hero{padding:2.6rem 0 1.4rem}
.kicker{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--teal);margin-bottom:.4rem}
.brand{font-size:clamp(2.1rem,5.5vw,3.2rem);font-weight:750;color:var(--deep);margin-bottom:.45rem}
.hero h1{font-size:clamp(1.05rem,2.3vw,1.35rem);max-width:24ch;margin-bottom:.6rem}
.lead{color:var(--muted);max-width:48ch;font-size:.95rem}
.warn{margin-top:1rem;padding:.85rem 1rem;border-radius:12px;background:#fff7ed;border:1px solid #fdba74;color:#7c2d12;font-size:.88rem}

.tabs{display:flex;flex-wrap:wrap;gap:.45rem;margin:1.2rem 0 1rem}
.tab{
  border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:.45rem .9rem;font-weight:700;font-size:.86rem;cursor:pointer;color:var(--muted);
}
.tab.on{background:var(--deep);color:#fff;border-color:transparent}
.tab .dot{display:inline-block;width:.45rem;height:.45rem;border-radius:50%;margin-right:.35rem;background:#94a3b8}
.tab.on .dot{background:#9be2c8}
.tab.todo .dot{background:#fdba74}

.zone-panel{display:none}
.zone-panel.on{display:block}
.zone-blurb{color:var(--muted);font-size:.92rem;margin-bottom:1rem;max-width:52ch}

details.j{
  background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:.65rem;overflow:hidden;
}
details.j[open]{border-color:rgba(12,122,95,.35)}
details.j>summary{
  list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:.7rem;align-items:center;
  padding:1rem 1.1rem;user-select:none;
}
details.j>summary::-webkit-details-marker{display:none}
details.j>summary:hover{background:#f6faf8}
.sum-l b{display:block;font-size:1.05rem;margin-bottom:.2rem}
.sum-l span{color:var(--muted);font-size:.84rem}
.fit{
  font-size:.72rem;font-weight:700;padding:.2rem .55rem;border-radius:999px;white-space:nowrap;
}
.fit.high{background:#ecfdf5;color:#065f46}
.fit.mid{background:#eff6ff;color:#1e40af}
.fit.low{background:#fff7ed;color:#9a3412}
.meta-row{display:flex;flex-wrap:wrap;gap:.35rem;margin:.35rem 0 .15rem}
.chip{
  font-size:.68rem;font-weight:700;padding:.15rem .45rem;border-radius:999px;
  background:#f1f5f4;color:var(--muted);border:1px solid var(--line);
}
.chip.cas{background:#ecfdf5;color:#065f46;border-color:#a7f3d0}
.chip.warn{background:#fef2f2;color:#991b1b;border-color:#fecaca}
.chip.track{background:#eff6ff;color:#1e40af;border-color:#bfdbfe}
.chip.sampled{background:#fff7ed;color:#9a3412;border-color:#fdba74}

.body{padding:0 1.1rem 1.15rem;border-top:1px solid var(--line)}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:.85rem;padding-top:1rem}
@media(max-width:780px){.grid{grid-template-columns:1fr}}
.box{background:#f7faf8;border:1px solid var(--line);border-radius:12px;padding:.85rem .9rem}
.box h4{font-family:Sora,sans-serif;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin-bottom:.45rem}
.box p,.box li{color:var(--muted);font-size:.88rem}
.box ul{padding-left:1.05rem;display:grid;gap:.25rem;margin-top:.25rem}

.bars{display:grid;gap:.4rem}
.bar-row{display:grid;grid-template-columns:7.5rem 1fr 2.6rem;gap:.45rem;align-items:center;font-size:.78rem}
.bar-row .lab{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:.55rem;background:rgba(16,24,32,.06);border-radius:999px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--teal),#14a37f);border-radius:999px}
.pct{text-align:right;font-weight:700;color:var(--deep);font-variant-numeric:tabular-nums}
.note{font-size:.84rem;color:var(--muted);margin-top:.7rem}
.todo-box{padding:1.1rem;border:1px dashed var(--line);border-radius:14px;background:#f7faf8;color:var(--muted);font-size:.92rem}

footer{padding:1.3rem 0 2.2rem;color:var(--muted);font-size:.84rem;border-top:1px solid var(--line);margin-top:1.5rem}
</style>
</head>
<body>
  <nav class="nav">
    <div class="wrap nav-inner">
      <a class="nav-brand" href="index.html">← 说服首页</a>
      <div class="nav-links">
        <a href="types.html">五种写法</a>
        <a href="#survey">分区调研</a>
        <a href="type-05.html#exemplars">影像范文</a>
      </div>
    </div>
  </nav>

  <header class="hero">
    <div class="wrap">
      <div class="kicker">新功能 · 期刊调研</div>
      <div class="brand">一区 → 四区</div>
      <h1>各刊写法分布，以及收什么方向</h1>
      <p class="lead">层级：先选分区 → 再点开期刊 → 看写法占比与收文方向，对照我们能不能投。</p>
      <div class="warn"><b>口径：</b>分区一律按 <b>2026 新锐期刊分区表大类</b>（2026-03-24；xr-scholar.com）。已含 <b>Frontiers 系列</b>（多数在二–四区；接单前先问单位认不认）。写法占比条仅一区已抽样刊有数字。</div>
    </div>
  </header>

  <main class="wrap" id="survey">
    <div class="tabs" id="tabs"></div>
    <div id="panels"></div>
  </main>

  <footer>
    <div class="wrap">分区标准：2026 新锐大类 · EuropePMC 抽样见「一区期刊写法分布」· data/journals-survey.json · 不作录用承诺</div>
  </footer>

  <script src="data/journals-survey.js"></script>
  <script>
  function bars(dist){
    if(!dist || !dist.length) return '<p class="note">尚无抽样占比。</p>';
    const max = Math.max(...dist.map(d=>d.pct), 1);
    return `<div class="bars">${dist.map(d=>`
      <div class="bar-row">
        <div class="lab" title="${d.label}">${d.label}</div>
        <div class="track"><div class="fill" style="width:${(d.pct/max)*100}%"></div></div>
        <div class="pct">${d.pct}%</div>
      </div>`).join('')}</div>`;
  }

  function journalCard(j){
    const hasDist = Array.isArray(j.dist) && j.dist.length;
    const accepts = (j.accepts||[]).map(x=>`<li>${x}</li>`).join('');
    const avoid = (j.avoid||[]).map(x=>`<li>${x}</li>`).join('');
    const types = (j.our_types&&j.our_types.length)
      ? `对齐写法 ${j.our_types.join(' / ')}`
      : '一般不对齐我们主方案';
    const pub = j.publisher && j.publisher !== '—' ? ` · ${j.publisher}` : '';
    const n = j.n ? ` · 抽样 n=${j.n}` : '';
    const xr = j.xr || j.cas;
    let cas = '';
    if (xr) {
      if (xr.zone == null) {
        cas = `<span class="chip warn">2026新锐 · ${xr.major||'未收录'}</span>`;
      } else {
        cas = `<span class="chip cas">2026新锐 · ${xr.major}${xr.zone}区${xr.top?' · Top':''}</span>`;
      }
    }
    const track = j.track ? `<span class="chip track">${j.track}</span>` : '';
    const sampled = j.sampled ? `<span class="chip sampled">已抽样占比</span>` : '';
    const minor = xr && xr.minor ? `<p class="note">小类/备注：${xr.minor}</p>` : '';
    return `<details class="j">
      <summary>
        <div class="sum-l">
          <b>${j.name}</b>
          <div class="meta-row">${cas}${track}${sampled}</div>
          <span>${types}${pub}${n}</span>
        </div>
        <span class="fit ${j.fit||'mid'}">${j.fit_label||''}</span>
      </summary>
      <div class="body">
        <div class="grid">
          <div class="box">
            <h4>${hasDist?'写法分布（粗）':'选刊说明'}</h4>
            ${hasDist?bars(j.dist):`<p>${j.note||'尚无写法占比抽样；先看收文方向。'}</p>`}
            ${minor}
          </div>
          <div class="box">
            <h4>收的方向</h4>
            <ul>${accepts||'<li>—</li>'}</ul>
            <h4 style="margin-top:.7rem">不太收 / 慎投</h4>
            <ul>${avoid||'<li>—</li>'}</ul>
          </div>
        </div>
        ${j.note&&hasDist?`<p class="note">${j.note}</p>`:''}
      </div>
    </details>`;
  }

  function render(data){
    const tabs = document.getElementById('tabs');
    const panels = document.getElementById('panels');
    tabs.innerHTML = '';
    panels.innerHTML = '';
    data.zones.forEach((z,i)=>{
      const btn = document.createElement('button');
      btn.className = 'tab' + (z.status==='todo'?' todo':'') + (i===0?' on':'');
      btn.type = 'button';
      btn.innerHTML = `<span class="dot"></span>${z.name}`;
      btn.dataset.zone = z.id;
      tabs.appendChild(btn);

      const panel = document.createElement('section');
      panel.className = 'zone-panel' + (i===0?' on':'');
      panel.id = z.id;
      const sampledReady = z.status==='ready';
      const count = (z.journals||[]).length;
      panel.innerHTML = `
        <p class="zone-blurb">${z.blurb||''} <b>本区 ${count} 本。</b></p>
        ${sampledReady?'':`<div class="todo-box"><b>名单已补：</b>本区有具体刊名与收文方向；写法占比条仍待 EuropePMC 抽样，故不显示假百分比。</div>`}
        ${(z.journals||[]).map(journalCard).join('')}
      `;
      panels.appendChild(panel);
    });

    tabs.querySelectorAll('.tab').forEach(btn=>{
      btn.addEventListener('click',()=>{
        tabs.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
        panels.querySelectorAll('.zone-panel').forEach(p=>p.classList.remove('on'));
        btn.classList.add('on');
        document.getElementById(btn.dataset.zone).classList.add('on');
      });
    });
  }

  (function(){
    const data = window.JOURNAL_SURVEY;
    if(!data){
      document.getElementById('panels').innerHTML = '<div class="todo-box">无法加载 data/journals-survey.js。</div>';
      return;
    }
    render(data);
    const hash = location.hash.replace('#','');
    if(hash && document.getElementById(hash)){
      document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on', b.dataset.zone===hash));
      document.querySelectorAll('.zone-panel').forEach(p=>p.classList.toggle('on', p.id===hash));
    }
  })();
  </script>
</body>
</html>
